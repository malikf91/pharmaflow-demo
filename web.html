<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>PharmaFlow Web Demo</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#17302b;--mute:#6b7f7a;--line:#e1e9e6;--brand:#0f7b6c;--brand2:#e6f4f1;--warn:#c77700;--warn2:#fff3dc;--bad:#c0392b;--bad2:#fdeaea;--ok:#1e8a4c;--ok2:#e5f6ec;--adv:#6a4fc4;--adv2:#efeafb}
@media (prefers-color-scheme:dark){:root{--bg:#10191a;--card:#172324;--ink:#e6f0ee;--mute:#8fa5a0;--line:#26393a;--brand:#35b3a1;--brand2:#12312e;--warn:#f0a63a;--warn2:#33291a;--bad:#ef6f61;--bad2:#3a1d1a;--ok:#4fc283;--ok2:#14301f;--adv:#a590f0;--adv2:#262040}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;font-size:17px;color:var(--brand);padding:4px 10px 14px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--ink);cursor:pointer;margin-bottom:2px}
.nav a:hover{background:var(--brand2)}
.nav a.on{background:var(--brand2);color:var(--brand);font-weight:600}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:14px 10px 4px}
.nav a.lock{color:var(--mute)}
.pill{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--adv2);color:var(--adv);margin-left:auto}
header{display:flex;gap:12px;align-items:center;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.seg.adv button.on{background:var(--adv)}
select,input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px}
main{padding:22px 24px;max-width:1150px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);margin-bottom:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 10px;font-size:14px}
.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:24px;font-weight:700;margin-top:2px}.kpi .d{font-size:12px;color:var(--ok)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mute);text-align:left;font-weight:500;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
.b-ok{background:var(--ok2);color:var(--ok)}.b-warn{background:var(--warn2);color:var(--warn)}.b-bad{background:var(--bad2);color:var(--bad)}.b-adv{background:var(--adv2);color:var(--adv)}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.a{background:var(--adv);color:#fff;border-color:var(--adv)}
.btn.sm{padding:3px 9px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.bars i{display:block;background:var(--brand);border-radius:5px 5px 0 0;margin-bottom:4px;opacity:.85}
.alert{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border:0}
.pos{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.pos{grid-template-columns:1fr}}
.res{max-height:300px;overflow:auto}
.res .it{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.res .it:hover{background:var(--brand2)}
.muted{color:var(--mute)}.small{font-size:12px}
.total{font-size:26px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
.modal input,.modal select{width:100%}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
.up{text-align:center;padding:40px 20px}
.up .big{font-size:34px}
.chip{border:1px solid var(--line);background:var(--card);padding:4px 12px;border-radius:99px;cursor:pointer;font-size:13px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.res .it.hl,tr.hl{background:var(--brand2);outline:1px solid var(--brand)}
.kb{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;font-size:12px;color:var(--mute)}
kbd{background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:11px ui-monospace,monospace;color:var(--ink)}
.hb{display:flex;align-items:center;gap:8px;margin:7px 0}.hb .lbl{width:150px;font-size:13px}.hb .tr{flex:1;background:var(--line);height:10px;border-radius:99px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--brand)}
.tile{cursor:pointer}.tile:hover{border-color:var(--brand)}
.tog{display:inline-block;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--ok)}.tog.on::after{left:16px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">⚕ PharmaFlow</div>
    <div class="nav" id="nav"></div>
  </aside>
  <div>
    <header>
      <b id="shopname">Al-Shifa Medical Store</b>
      <select id="branch" onchange="setBranch(this.value)" style="display:none"></select>
      <span class="sp"></span>
      <span class="small muted">Demo plan:</span>
      <div class="seg" id="tierseg"><button data-t="basic" class="on">Basic</button><button data-t="adv">Advanced I</button></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="layer"></div>

<script>
// ---------- demo data (illustrative only) ----------
const TODAY = new Date(2026,9,7);
const catalogue = [
 ['Panadol 500mg','Paracetamol','Tablet','GSK'],['Panadol Extra','Paracetamol + Caffeine','Tablet','GSK'],
 ['Calpol 120mg/5ml','Paracetamol','Syrup','GSK'],['Brufen 400mg','Ibuprofen','Tablet','Abbott'],
 ['Augmentin 625mg','Amoxicillin + Clavulanate','Tablet','GSK'],['Amoxil 500mg','Amoxicillin','Capsule','GSK'],
 ['Risek 20mg','Omeprazole','Capsule','Getz'],['Nexium 40mg','Esomeprazole','Tablet','AstraZeneca'],
 ['Flagyl 400mg','Metronidazole','Tablet','Sanofi'],['Glucophage 500mg','Metformin','Tablet','Merck'],
 ['Concor 5mg','Bisoprolol','Tablet','Merck'],['Ventolin Inhaler','Salbutamol','Inhaler','GSK'],
 ['Arinac Forte','Ibuprofen + Pseudoephedrine','Tablet','Abbott'],['Surbex Z','Multivitamin + Zinc','Tablet','Abbott']
];
let items = [
 {id:1,name:'Panadol 500mg',gen:'Paracetamol',form:'Tablet',per:20,stock:640,price:60,batch:'B2291',exp:'2027-08'},
 {id:2,name:'Brufen 400mg',gen:'Ibuprofen',form:'Tablet',per:20,stock:200,price:140,batch:'A7712',exp:'2027-03'},
 {id:3,name:'Augmentin 625mg',gen:'Amoxicillin + Clavulanate',form:'Tablet',per:6,stock:0,price:520,batch:'—',exp:'—'},
 {id:4,name:'Amoxil 500mg',gen:'Amoxicillin',form:'Capsule',per:12,stock:96,price:210,batch:'C1180',exp:'2026-12'},
 {id:5,name:'Risek 20mg',gen:'Omeprazole',form:'Capsule',per:14,stock:280,price:260,batch:'R5521',exp:'2027-06'},
 {id:6,name:'Calpol 120mg/5ml',gen:'Paracetamol',form:'Syrup',per:1,stock:4,price:185,batch:'S3301',exp:'2026-11'},
 {id:7,name:'Glucophage 500mg',gen:'Metformin',form:'Tablet',per:30,stock:360,price:175,batch:'G0044',exp:'2028-01'},
 {id:8,name:'Flagyl 400mg',gen:'Metronidazole',form:'Tablet',per:20,stock:60,price:95,batch:'F9120',exp:'2026-10'},
 {id:9,name:'Ventolin Inhaler',gen:'Salbutamol',form:'Inhaler',per:1,stock:9,price:650,batch:'V2208',exp:'2027-09'},
 {id:11,name:'Clavam 625mg',gen:'Amoxicillin + Clavulanate',form:'Tablet',per:6,stock:48,price:480,batch:'L4410',exp:'2027-05'},
 {id:10,name:'Concor 5mg',gen:'Bisoprolol',form:'Tablet',per:30,stock:150,price:430,batch:'K1197',exp:'2027-11'}
];
items.forEach(i=>i.reorder=i.per>1?i.per*5:3);
items.push({id:12,name:'Surbex Z',gen:'Multivitamin + Zinc',form:'Tablet',per:30,stock:240,price:320,batch:'Z0912',exp:'2026-12',reorder:150},{id:13,name:'Arinac Forte',gen:'Ibuprofen + Pseudoephedrine',form:'Tablet',per:20,stock:200,price:120,batch:'N3350',exp:'2026-11',reorder:100});
items.forEach(i=>i.bc='89600'+String(1000+i.id*7));
let nextId=14;
let customers=[
 {n:'Mr. Tariq Hussain',ph:'0300-1234567',bal:4200,days:21,refill:null},
 {n:'Mrs. Ayesha Khan',ph:'0321-7654321',bal:1850,days:6,refill:{med:'Glucophage 500mg',due:'in 2 days'}},
 {n:'Haji Rafiq',ph:'0333-9988776',bal:9600,days:45,refill:{med:'Concor 5mg',due:'today'}},
 {n:'Bilal Ahmed',ph:'0345-1122334',bal:700,days:3,refill:null}
];
let suppliers=[{n:'Alpha Distributors',bal:86000,due:'12 Oct'},{n:'Medi Link Traders',bal:42500,due:'15 Oct'},{n:'City Pharma Wholesale',bal:18200,due:'25 Oct'}];
let expenses=[
 {t:'Monthly',c:'Shop rent',a:65000,d:'1 Oct'},{t:'Monthly',c:'Electricity',a:18400,d:'3 Oct'},
 {t:'Daily',c:'Tea & cleaning',a:450,d:'7 Oct'},{t:'Ad-hoc',c:'AC repair',a:7500,d:'5 Oct'},{t:'Monthly',c:'Internet',a:3000,d:'2 Oct'}
];
let staff=[
 {n:'Usman Ali',r:'Pharmacist',sal:60000,adv:0,bon:5000,pres:true,leave:0},
 {n:'Saad Mehmood',r:'Cashier',sal:38000,adv:5000,bon:0,pres:true,leave:1},
 {n:'Imran Shah',r:'Sales Assistant',sal:32000,adv:0,bon:2000,pres:false,leave:2},
 {n:'Waqas',r:'Delivery / Helper',sal:28000,adv:3000,bon:0,pres:true,leave:0}
];
const branches={all:{n:'All branches',mult:1},g:{n:'Gulberg (Main)',mult:.5},j:{n:'Johar Town',mult:.3},m:{n:'Model Town',mult:.2}};
let state={tier:'basic',page:'dash',branch:'g',cart:[],q:'',tab:{},inv:'all',pay:'Cash'};

const rs=n=>'Rs '+Math.round(n).toLocaleString('en-PK');
const $=s=>document.querySelector(s);
const isAdv=()=>state.tier==='adv';

// ---------- derived ----------
function expDays(e){if(!/\d{4}-\d{2}/.test(e))return 9999;const[y,m]=e.split('-').map(Number);return Math.round((new Date(y,m,0)-TODAY)/864e5)}
function status(i){const d=expDays(i.exp);if(i.stock===0)return['Out of stock','b-bad'];if(d<0)return['Expired','b-bad'];if(d<=90)return['Expiring '+i.exp,'b-warn'];if(i.stock<=i.reorder*(i.per>1?1:1))return['Low stock','b-warn'];return['OK','b-ok']}
function stockTxt(i){if(i.per===1)return i.stock+' pcs';const p=Math.floor(i.stock/i.per),l=i.stock%i.per;return p+' packs'+(l?' + '+l+' loose':'')}

// ---------- nav ----------
const NAV=[
 {g:'Daily'},{id:'dash',t:'🏠 Dashboard'},{id:'pos',t:'🧾 Sell (POS)'},{id:'inv',t:'📦 Stock'},
 {g:'Money'},{id:'khata',t:'📒 Khata & Dues'},{id:'exp',t:'💸 Expenses'},{id:'staff',t:'👥 Staff & Payroll'},{id:'rep',t:'📊 Reports'},
 {g:'Advanced I',adv:true},{id:'ctrl',t:'🔒 Controlled Drugs',adv:true},{id:'audit',t:'🛡 Permissions & Audit',adv:true}
];
function renderNav(){
  $('#nav').innerHTML=NAV.map(n=>{
    if(n.g)return `<div class="grp">${n.g}</div>`;
    const lock=n.adv&&!isAdv();
    return `<a class="${state.page===n.id?'on':''} ${lock?'lock':''}" onclick="go('${n.id}')">${n.t}${lock?'<span class="pill">🔒</span>':''}</a>`}).join('');
  $('#tierseg').className='seg'+(isAdv()?' adv':'');
  document.querySelectorAll('#tierseg button').forEach(b=>b.classList.toggle('on',b.dataset.t===state.tier));
  const br=$('#branch');br.style.display=isAdv()?'':'none';
  br.innerHTML=Object.entries(branches).map(([k,v])=>`<option value="${k}" ${state.branch===k?'selected':''}>${v.n}</option>`).join('');
}
document.querySelectorAll('#tierseg button').forEach(b=>b.onclick=()=>{state.tier=b.dataset.t;if(!isAdv()&&['ctrl','audit'].includes(state.page)){}render()});
function go(p){state.page=p;if(p==='rep')state.rep=null;render()}
function setBranch(b){state.branch=b;render()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(html){$('#layer').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="box">${html}</div></div>`}
function closeM(){$('#layer').innerHTML='';state.receipt=false;if(state.page==='pos'&&$('#q'))$('#q').focus()}
function tabs(key,list,def){const cur=state.tab[key]||def;return `<div class="tabs">${list.map(([k,t])=>`<button class="${cur===k?'on':''}" onclick="state.tab['${key}']='${k}';render()">${t}</button>`).join('')}</div>`}
function upsell(title,pts){return `<div class="card up"><div class="big">🔒</div><h1>${title}</h1><p class="muted">Available in <b>Advanced I</b></p><ul style="display:inline-block;text-align:left">${pts.map(p=>`<li>${p}</li>`).join('')}</ul><div><button class="btn a" onclick="state.tier='adv';render()">Preview Advanced I</button></div></div>`}

// ---------- pages ----------
const P={};
P.dash=()=>{
  const b=branches[isAdv()?state.branch:'g'];const m=isAdv()?b.mult:1;
  const sales=Math.round(84500*m*(isAdv()?2:1)/(isAdv()?1:1)), profit=Math.round(sales*.19);
  const low=items.filter(i=>i.stock>0&&i.stock<=i.reorder).length+items.filter(i=>i.stock===0).length;
  const exp=items.filter(i=>expDays(i.exp)<=90&&i.stock>0).length;
  const recv=customers.reduce((a,c)=>a+c.bal,0), pay=suppliers.reduce((a,s)=>a+s.bal,0);
  const days=['Thu','Fri','Sat','Sun','Mon','Tue','Wed'],vals=[.8,1,.9,.7,1.1,.95,1];
  let h=`<h1>Good morning, Hamza 👋</h1><div class="sub">${isAdv()?b.n:'Al-Shifa Medical Store'} · Wednesday, 7 October 2026</div>
  <div class="grid g4">
   <div class="card kpi"><div class="l">Today's sales</div><div class="v">${rs(sales)}</div><div class="d">▲ 8% vs yesterday</div></div>
   <div class="card kpi"><div class="l">Today's profit</div><div class="v">${rs(profit)}</div><div class="d">19% margin</div></div>
   <div class="card kpi"><div class="l">Cash in drawer</div><div class="v">${rs(sales*.55)}</div><div class="l">Opened with Rs 10,000</div></div>
   <div class="card kpi"><div class="l">Customers owe you</div><div class="v">${rs(recv)}</div><div class="l">You owe suppliers ${rs(pay)}</div></div>
  </div><br><div class="grid g2">
   <div class="card"><h3>Last 7 days sales</h3><div class="bars">${vals.map((v,i)=>`<div><i style="height:${v*90}px"></i>${days[i]}</div>`).join('')}</div></div>
   <div class="card"><h3>Needs attention</h3>
     <div class="alert"><span>📉 Low / out of stock</span><span><b>${low}</b> items <a class="btn sm" onclick="state.inv='low';go('inv')">View</a></span></div>
     <div class="alert"><span>⏳ Expiring within 90 days</span><span><b>${exp}</b> items <a class="btn sm" onclick="state.inv='exp';go('inv')">View</a></span></div>
     <div class="alert"><span>🏭 Supplier payment due</span><span><b>Rs 86,000</b> by 12 Oct <a class="btn sm" onclick="go('khata')">Pay</a></span></div>
     <div class="alert"><span>📒 Overdue khata (&gt;30 days)</span><span><b>1</b> customer <a class="btn sm" onclick="go('khata')">Remind</a></span></div>
   </div></div>`;
  if(isAdv()&&state.branch==='all')h+=`<br><div class="card"><h3>Branch comparison (today)</h3><table><tr><th>Branch</th><th class="r">Sales</th><th class="r">Profit</th><th class="r">Expiring items</th><th class="r">Cash</th></tr>
   ${['g','j','m'].map(k=>{const s=Math.round(169000*branches[k].mult);return `<tr><td>${branches[k].n}</td><td class="r">${rs(s)}</td><td class="r">${rs(s*.19)}</td><td class="r">${k==='g'?4:k==='j'?2:1}</td><td class="r">${rs(s*.55)}</td></tr>`}).join('')}</table></div>`;
  if(!isAdv())h+=`<br><div class="card" style="background:var(--adv2);border-color:transparent"><b style="color:var(--adv)">Growing?</b> <span class="muted">Advanced I adds multiple branches, barcode scan, controlled-drug register and approvals.</span> <a class="btn sm a" onclick="state.tier='adv';render()">Preview</a></div>`;
  return h};

// POS
let billNo=2232;
let held=[];
let bills=[{no:2231,t:'10:42',cust:'Walk-in',amt:3450,by:'Saad'},{no:2230,t:'10:31',cust:'Mrs. Ayesha Khan',amt:1850,by:'Usman'},{no:2229,t:'10:20',cust:'Walk-in',amt:720,by:'Saad'}];
Object.assign(state,{sel:0,csel:-1,cust:'Walk-in',disc:0,recv:'',fq:null,receipt:false});
const billId=n=>'INV-'+String(n).padStart(6,'0');
const PAYS=['Cash','Card','Wallet','Khata'];
function unitPrice(l){const i=items.find(x=>x.id===l.id);return l.unit==='pack'?i.price:i.price/i.per}
function lineAmt(l){return Math.round(unitPrice(l)*l.qty)}
function cartTotal(){return state.cart.reduce((a,l)=>a+lineAmt(l),0)}
function netTotal(){return Math.max(0,cartTotal()-(state.disc||0))}
function posResults(){
  const q=state.q.trim().toLowerCase();
  return items.filter(i=>!q||i.name.toLowerCase().includes(q)||i.gen.toLowerCase().includes(q)||i.bc.includes(q)).slice(0,8)}
function resHTML(){
  const res=posResults();if(state.sel>=res.length)state.sel=Math.max(0,res.length-1);
  return res.map((i,ix)=>{const s=status(i);return `<div class="it ${ix===state.sel?'hl':''}" onclick="addCart(${i.id})"><div><b>${i.name}</b><div class="small muted">${i.gen} · ${i.form} · ${stockTxt(i)} · <span style="opacity:.7">${i.bc}</span></div></div><div style="text-align:right">${rs(i.price)}<div><span class="badge ${s[1]}">${s[0]}</span></div></div></div>`}).join('')||'<p class="muted" style="padding:8px">No match. <a class="btn sm" onclick="addMed()">+ Add medicine</a></p>'}
P.pos=()=>{
  const total=netTotal(),recv=+state.recv||0;
  const kb=[['F2','Search'],['↑↓','Pick'],['Enter','Add'],['F3','Pack/Tablet'],['F4','Discount'],['F6','Hold'],['F7','Held'],['F8','Payment'],['F9','Complete'],['F10','Recent bills']];
  return `<div class="row" style="justify-content:space-between;margin-bottom:10px"><div><h1 style="display:inline">Sell</h1> <span class="badge b-ok" style="font-size:13px">${billId(billNo)}</span></div>
   <div class="row small muted"><span>07 Oct 2026 · 10:48</span><span>Cashier: <b>Saad Mehmood</b></span><span>Customer:</span>
   <select id="cust" onchange="state.cust=this.value">${['Walk-in'].concat(customers.map(c=>c.n)).map(n=>`<option ${state.cust===n?'selected':''}>${n}</option>`).join('')}</select></div></div>
  <div class="pos"><div class="card">
    <div class="row"><input id="q" style="flex:1" autocomplete="off" placeholder="Type name / generic, or scan barcode, then Enter…" value="${state.q}" oninput="state.q=this.value;state.sel=0;$('#res').innerHTML=resHTML()">
    ${isAdv()?'<button class="btn a" onclick="scan()">▥ Scan 2D code</button>':''}</div>
    <div class="res" id="res" style="margin-top:10px">${resHTML()}</div>
  </div>

   <hr style="border:0;border-top:1px solid var(--line)">
   <div class="row" style="justify-content:space-between"><span>Subtotal</span><span>${rs(cartTotal())}</span></div>

   <div class="row" style="justify-content:space-between;margin:10px 0"><span>Total</span><span class="total">${rs(total)}</span></div>
   <div class="row">${PAYS.map(p=>`<span class="chip ${state.pay===p?'on':''}" onclick="state.pay='${p}';render()">${p}</span>`).join('')}</div>
   ${state.pay==='Cash'?`<div class="row" style="margin-top:10px"><span class="muted small">Received</span><input id="recv" type="number" value="${state.recv}" style="width:110px" oninput="state.recv=this.value;$('#chg').textContent=rs(Math.max(0,(+this.value||0)-netTotal()))"><span class="muted small">Change</span><b id="chg">${rs(Math.max(0,recv-total))}</b></div>`:''}
   <div class="row" style="margin-top:12px"><button class="btn p" style="flex:1;padding:10px" onclick="checkout()">Complete sale (F9)</button><button class="btn" onclick="holdBill()">Hold (F6)</button><button class="btn" onclick="newBill()">Clear</button></div>
  </div></div>
  <div class="kb">${kb.map(k=>`<span><kbd>${k[0]}</kbd> ${k[1]}</span>`).join('')}<span><kbd>Alt+↑↓</kbd> Select line</span><span><kbd>Del</kbd> Remove line</span><span><kbd>+</kbd><kbd>−</kbd> Qty</span></div>`};
function newBill(){state.cart=[];state.disc=0;state.recv='';state.cust='Walk-in';state.q='';state.csel=-1;state.sel=0;render()}
function holdBill(){if(!state.cart.length)return toast('Nothing to hold');held.push({cart:state.cart,cust:state.cust,disc:state.disc,t:'10:48'});newBill();toast('Bill held. Press F7 to resume.')}
function showHeld(){modal(`<h3>Held bills</h3>${held.length?held.map((h,ix)=>`<div class="alert"><span><b>${h.cart.length} item(s)</b> · ${h.cust}<div class="small muted">held at ${h.t}</div></span><button class="btn sm p" onclick="resume(${ix})">Resume</button></div>`).join(''):'<p class="muted">No held bills.</p>'}<br><button class="btn" onclick="closeM()">Close (Esc)</button>`)}
function resume(ix){const h=held.splice(ix,1)[0];state.cart=h.cart;state.cust=h.cust;state.disc=h.disc;closeM();render()}
function showRecent(){modal(`<h3>Recent bills</h3>${bills.slice(0,6).map(b=>`<div class="alert"><span><b>${billId(b.no)}</b> · ${rs(b.amt)}<div class="small muted">${b.t} · ${b.cust} · ${b.by}</div></span><button class="btn sm" onclick="closeM();toast('Return flow would open for ${billId(b.no)}')">Return</button></div>`).join('')}<br><button class="btn" onclick="closeM()">Close (Esc)</button>`)}
function addCart(id){const i=items.find(x=>x.id===id);
  if(i.stock===0){
    if(isAdv()){const subs=items.filter(x=>x.id!==id&&x.stock>0&&x.gen===i.gen);
      return modal(`<h3>${i.name} is out of stock</h3><p class="muted small">Same salt: ${i.gen}</p>${subs.length?subs.map(s=>`<div class="alert"><span><b>${s.name}</b><div class="small muted">${stockTxt(s)} · ${rs(s.price)}</div></span><button class="btn sm p" onclick="closeM();addCart(${s.id})">Use this</button></div>`).join(''):'<p>No alternative with the same salt in stock.</p>'}<br><button class="btn" onclick="closeM()">Close</button>`)}
    return toast('Out of stock')}
  let ix=state.cart.findIndex(l=>l.id===id);if(ix>=0)state.cart[ix].qty++;else{state.cart.push({id,unit:'pack',qty:1});ix=state.cart.length-1}
  state.csel=ix;state.q='';state.sel=0;state.fq=ix;render()}
function scan(){const i=items[0];modal(`<h3>▥ Scanned 2D code</h3><p class="muted small">Read from the pack – nothing typed.</p><table><tr><td class="muted">Product</td><td><b>${i.name}</b></td></tr><tr><td class="muted">Manufacturer</td><td>GSK</td></tr><tr><td class="muted">Batch</td><td>B2291</td></tr><tr><td class="muted">Expiry</td><td>08/2027</td></tr><tr><td class="muted">Serial</td><td>0100…8821 (verified ✓)</td></tr></table><br><div class="row"><button class="btn a" onclick="closeM();addCart(1)">Add to bill</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}
function checkout(){if(!state.cart.length)return toast('Bill is empty');
  const t=netTotal();
  if(state.pay==='Khata'&&state.cust==='Walk-in')return toast('Pick a customer for khata sale');
  const recv=+state.recv||0;if(state.pay==='Cash'&&recv&&recv<t)return toast('Received amount is less than total');
  const lines=state.cart.map(l=>{const i=items.find(x=>x.id===l.id);return {n:i.name,u:l.unit==='pack'?'pack':'tab',q:l.qty,a:lineAmt(l)}});
  const sub=cartTotal(),disc=state.disc||0,no=billNo,cust=state.cust,pay=state.pay;
  state.cart.forEach(l=>{const i=items.find(x=>x.id===l.id);i.stock=Math.max(0,i.stock-(l.unit==='pack'?l.qty*i.per:l.qty))});
  if(pay==='Khata'){const c=customers.find(x=>x.n===cust);if(c)c.bal+=t}
  bills.unshift({no,t:'10:48',cust,amt:t,by:'Saad'});billNo++;
  state.cart=[];state.disc=0;state.recv='';state.q='';state.cust='Walk-in';state.csel=-1;state.receipt=true;render();
  modal(`<div style="text-align:center"><b>Al-Shifa Medical Store</b><div class="small muted">Gulberg, Lahore · Ph 042-1234567</div></div><hr style="border:0;border-top:1px dashed var(--line)">
   <div class="small row" style="justify-content:space-between"><span>${billId(no)}</span><span>07 Oct 2026 10:48</span></div><div class="small muted">Customer: ${cust} · Cashier: Saad</div>
   <table style="margin:8px 0">${lines.map(l=>`<tr><td>${l.n}<div class="small muted">${l.q} ${l.u}</div></td><td class="r">${rs(l.a)}</td></tr>`).join('')}</table>
   <div class="small row" style="justify-content:space-between"><span>Subtotal</span><span>${rs(sub)}</span></div>${disc?`<div class="small row" style="justify-content:space-between"><span>Discount</span><span>− ${rs(disc)}</span></div>`:''}
   <div class="row" style="justify-content:space-between"><b>Total (${pay})</b><b class="total" style="font-size:20px">${rs(t)}</b></div>${pay==='Cash'&&recv?`<div class="small row" style="justify-content:space-between"><span>Received ${rs(recv)}</span><span>Change ${rs(Math.max(0,recv-t))}</span></div>`:''}
   <p class="small muted" style="text-align:center">Thank you · Please check expiry before use</p><div class="row"><button class="btn" style="flex:1" onclick="toast('Sent to printer')">🖨 Print</button><button class="btn p" style="flex:1" onclick="closeM()">New bill (Enter)</button></div>`)}

// keyboard
document.addEventListener('keydown',e=>{
  const open=$('#layer .modal');
  if(open){if(e.key==='Escape'||(state.receipt&&e.key==='Enter')){e.preventDefault();closeM()}return}
  if(state.page!=='pos')return;
  const k=e.key,inQ=document.activeElement&&document.activeElement.id==='q';
  const F={F2:()=>$('#q').focus(),F3:()=>{const ix=state.csel>=0?state.csel:state.cart.length-1;if(ix>=0&&items.find(x=>x.id===state.cart[ix].id).per>1){state.cart[ix].unit=state.cart[ix].unit==='pack'?'loose':'pack';render()}},
   F4:()=>{$('#disc').focus();$('#disc').select()},F6:holdBill,F7:showHeld,F8:()=>{state.pay=PAYS[(PAYS.indexOf(state.pay)+1)%PAYS.length];render()},F9:checkout,F10:showRecent};
  if(F[k]){e.preventDefault();F[k]();return}
  if(k==='Enter'&&e.ctrlKey){e.preventDefault();checkout();return}
  if(k==='ArrowDown'&&e.altKey||k==='ArrowUp'&&e.altKey){e.preventDefault();if(!state.cart.length)return;state.csel=Math.max(0,Math.min(state.cart.length-1,(state.csel<0?state.cart.length-1:state.csel)+(k==='ArrowDown'?1:-1)));render();return}
  if(inQ){
    if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();const n=posResults().length;state.sel=Math.max(0,Math.min(n-1,state.sel+(k==='ArrowDown'?1:-1)));$('#res').innerHTML=resHTML();return}
    if(k==='Enter'){e.preventDefault();const q=state.q.trim(),ex=items.find(i=>i.bc===q);const r=ex||posResults()[state.sel];if(r)addCart(r.id);return}
    if(k==='Escape'){state.q='';state.sel=0;$('#q').value='';$('#res').innerHTML=resHTML();return}
    if(state.q===''&&(k==='+'||k==='-')){e.preventDefault();const ix=state.csel>=0?state.csel:state.cart.length-1;if(ix>=0){state.cart[ix].qty=Math.max(1,state.cart[ix].qty+(k==='+'?1:-1));render()}return}
    if(state.q===''&&k==='Delete'){e.preventDefault();const ix=state.csel>=0?state.csel:state.cart.length-1;if(ix>=0){state.cart.splice(ix,1);state.csel=-1;render()}}
  }
});

function addMed(){
  modal(`<h3>Add medicine</h3><label>Search catalogue (type 3+ letters)</label><input id="cs" placeholder="e.g. risek, ventolin, metformin" oninput="catSearch(this.value)">
  <div id="cres" class="res" style="max-height:140px"></div>

  <div class="row" style="gap:8px"><div style="flex:1"><label>Batch</label><input id="f_b" value="NEW-001"></div><div style="flex:1"><label>Expiry (YYYY-MM)</label><input id="f_e" value="2028-06"></div></div>

function catSearch(v){v=v.toLowerCase();const r=v.length<3?[]:catalogue.filter(c=>c[0].toLowerCase().includes(v)||c[1].toLowerCase().includes(v));
  $('#cres').innerHTML=r.map((c,ix)=>`<div class="it" onclick="pickCat('${c[0]}')"><div><b>${c[0]}</b><div class="small muted">${c[1]} · ${c[2]} · ${c[3]}</div></div><span class="badge b-ok">DRAP</span></div>`).join('')||(v.length>=3?'<p class="muted small">Not in catalogue – add manually.</p>':'')}
function pickCat(n){picked=catalogue.find(c=>c[0]===n);$('#cres').innerHTML=`<div class="alert"><span><b>${picked[0]}</b><div class="small muted">${picked[1]} · ${picked[2]} · ${picked[3]}</div></span><span class="badge b-ok">Selected</span></div>`;$('#cform').style.display='';$('#saveMed').style.display=''}
function saveMed(){const p=+$('#f_p').value||1;items.push({id:nextId++,name:picked[0],gen:picked[1],form:picked[2],per:p,stock:(+$('#f_q').value||0)*p,price:+$('#f_pr').value||0,batch:$('#f_b').value,exp:$('#f_e').value,reorder:p>1?p*5:3});closeM();toast(picked[0]+' added to stock');state.iq='';render()}

function paySup(ix){const s=suppliers[ix];modal(`<h3>Pay ${s.n}</h3><p class="muted">Outstanding ${rs(s.bal)}</p><label>Amount (Rs)</label><input id="amt" type="number" value="${s.bal}"><br><br><div class="row"><button class="btn p" onclick="suppliers[${ix}].bal=Math.max(0,suppliers[${ix}].bal-(+$('#amt').value||0));closeM();toast('Payment recorded');render()">Save</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}

function bars(vals,labels,h,hi){const mx=Math.max(...vals);return `<div class="bars" style="height:${h||130}px">${vals.map((v,i)=>`<div title="${labels[i]}: ${v}"><i style="height:${Math.max(4,v/mx*((h||130)-26))}px;${i===hi?'background:var(--adv)':''}"></i>${labels[i]}</div>`).join('')}</div>`}
function hbars(rows,fmt,color){const mx=Math.max(...rows.map(r=>r[1]));return rows.map(r=>`<div class="hb"><span class="lbl">${r[0]}</span><span class="tr"><i style="width:${r[1]/mx*100}%;${color?'background:'+color:''}"></i></span><b class="small" style="min-width:70px;text-align:right">${fmt?fmt(r[1]):rs(r[1])}</b></div>`).join('')}
const stockVal=i=>Math.round(i.stock/i.per*i.price*.8);
function expRisk(){return items.filter(i=>i.stock>0&&expDays(i.exp)<=90).map(i=>({i,d:expDays(i.exp),v:stockVal(i)})).sort((a,b)=>a.d-b.d)}
